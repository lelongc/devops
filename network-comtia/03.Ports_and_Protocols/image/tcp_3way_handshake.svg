<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" fill="#cba6f7" font-weight="bold" text-anchor="middle">BẮT TAY 3 BƯỚC TCP (TCP 3-WAY HANDSHAKE)</text>
  
  <!-- Client Box -->
  <rect x="80" y="70" width="160" height="50" fill="#89b4fa" rx="8"/>
  <text x="160" y="100" font-family="Arial, sans-serif" font-size="16" fill="#11111b" font-weight="bold" text-anchor="middle">Client (Browser)</text>

  <!-- Server Box -->
  <rect x="560" y="70" width="160" height="50" fill="#a6e3a1" rx="8"/>
  <text x="640" y="100" font-family="Arial, sans-serif" font-size="16" fill="#11111b" font-weight="bold" text-anchor="middle">Server (Nginx)</text>

  <!-- Lines -->
  <line x1="160" y1="120" x2="160" y2="360" stroke="#89b4fa" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="640" y1="120" x2="640" y2="360" stroke="#a6e3a1" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Step 1 SYN -->
  <line x1="160" y1="160" x2="630" y2="200" stroke="#f38ba8" stroke-width="4" marker-end="url(#arrow)"/>
  <polygon points="630,200 620,193 620,207" fill="#f38ba8"/>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="14" fill="#f38ba8" font-weight="bold" text-anchor="middle">1. SYN (Seq = x)</text>

  <!-- Step 2 SYN-ACK -->
  <line x1="640" y1="230" x2="170" y2="270" stroke="#f9e2af" stroke-width="4"/>
  <polygon points="170,270 180,263 180,277" fill="#f9e2af"/>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="14" fill="#f9e2af" font-weight="bold" text-anchor="middle">2. SYN-ACK (Seq = y, Ack = x + 1)</text>

  <!-- Step 3 ACK -->
  <line x1="160" y1="300" x2="630" y2="340" stroke="#a6e3a1" stroke-width="4"/>
  <polygon points="630,340 620,333 620,347" fill="#a6e3a1"/>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="14" fill="#a6e3a1" font-weight="bold" text-anchor="middle">3. ACK (Ack = y + 1) -> ESTABLISHED</text>
</svg>