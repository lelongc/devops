<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="800" height="420" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" fill="#cba6f7" font-weight="bold" text-anchor="middle">QUY TRÌNH PHÂN GIẢI TÊN MIỀN DNS (DNS RESOLUTION FLOW)</text>

  <!-- Client -->
  <rect x="50" y="80" width="140" height="60" fill="#89b4fa" rx="8"/>
  <text x="120" y="115" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">Client Browser</text>

  <!-- Local DNS Resolver -->
  <rect x="50" y="260" width="140" height="60" fill="#a6e3a1" rx="8"/>
  <text x="120" y="295" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">DNS Resolver (8.8.8.8)</text>

  <!-- Root DNS -->
  <rect x="500" y="80" width="220" height="50" fill="#f38ba8" rx="8"/>
  <text x="610" y="110" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">1. Root DNS Server (.)</text>

  <!-- TLD DNS -->
  <rect x="500" y="180" width="220" height="50" fill="#fab387" rx="8"/>
  <text x="610" y="210" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">2. TLD DNS Server (.com)</text>

  <!-- Auth DNS -->
  <rect x="500" y="280" width="220" height="50" fill="#f9e2af" rx="8"/>
  <text x="610" y="310" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">3. Authoritative DNS</text>

  <!-- Arrows -->
  <line x1="120" y1="140" x2="120" y2="260" stroke="#89b4fa" stroke-width="3"/>
  <text x="130" y="200" font-family="Arial, sans-serif" font-size="12" fill="#89b4fa">Query google.com</text>

  <line x1="190" y1="280" x2="500" y2="105" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="190" y1="290" x2="500" y2="205" stroke="#fab387" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="190" y1="300" x2="500" y2="305" stroke="#f9e2af" stroke-width="3"/>
</svg>