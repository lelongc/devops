<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" fill="#cba6f7" font-weight="bold" text-anchor="middle">KIẾN TRÚC MẠNG ẢO VLAN 802.1Q &amp; TRUNKING</text>

  <rect x="80" y="80" width="180" height="100" fill="#89b4fa" rx="8"/>
  <text x="170" y="115" font-family="Arial, sans-serif" font-size="15" fill="#11111b" font-weight="bold" text-anchor="middle">VLAN 10 (Finance)</text>
  <text x="170" y="145" font-family="Arial, sans-serif" font-size="13" fill="#11111b" text-anchor="middle">Access Port (Untagged)</text>

  <rect x="80" y="230" width="180" height="100" fill="#a6e3a1" rx="8"/>
  <text x="170" y="265" font-family="Arial, sans-serif" font-size="15" fill="#11111b" font-weight="bold" text-anchor="middle">VLAN 20 (DevOps)</text>
  <text x="170" y="295" font-family="Arial, sans-serif" font-size="13" fill="#11111b" text-anchor="middle">Access Port (Untagged)</text>

  <!-- Switch -->
  <rect x="360" y="140" width="160" height="150" fill="#cba6f7" rx="8"/>
  <text x="440" y="180" font-family="Arial, sans-serif" font-size="16" fill="#11111b" font-weight="bold" text-anchor="middle">Switch L2 / L3</text>
  <text x="440" y="210" font-family="Arial, sans-serif" font-size="12" fill="#11111b" text-anchor="middle">802.1Q Engine</text>

  <!-- Lines -->
  <line x1="260" y1="130" x2="360" y2="180" stroke="#89b4fa" stroke-width="4"/>
  <line x1="260" y1="280" x2="360" y2="250" stroke="#a6e3a1" stroke-width="4"/>

  <!-- Trunk Line -->
  <line x1="520" y1="215" x2="660" y2="215" stroke="#f38ba8" stroke-width="6" stroke-dasharray="8,4"/>
  <text x="590" y="200" font-family="Arial, sans-serif" font-size="13" fill="#f38ba8" font-weight="bold" text-anchor="middle">802.1Q Trunk Port</text>
  <text x="590" y="240" font-family="Arial, sans-serif" font-size="12" fill="#f38ba8" text-anchor="middle">(4-Byte Tagged)</text>

  <rect x="660" y="170" width="110" height="90" fill="#f9e2af" rx="8"/>
  <text x="715" y="220" font-family="Arial, sans-serif" font-size="15" fill="#11111b" font-weight="bold" text-anchor="middle">Router L3</text>
</svg>