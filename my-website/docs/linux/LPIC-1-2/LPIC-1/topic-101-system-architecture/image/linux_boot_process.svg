<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" fill="#cba6f7" font-weight="bold" text-anchor="middle">TIẾN TRÌNH KHỞI ĐỘNG LINUX (LINUX BOOT SEQUENCE)</text>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <rect x="50" y="70" width="700" height="40" fill="#f38ba8" rx="6"/>
    <text x="70" y="95" fill="#11111b">1. BIOS / UEFI POST (Phần cứng kiểm tra POST &amp; chọn đĩa boot)</text>

    <rect x="50" y="125" width="700" height="40" fill="#fab387" rx="6"/>
    <text x="70" y="150" fill="#11111b">2. GRUB2 Bootloader (Load Kernel vmlinuz &amp; initramfs vào RAM)</text>

    <rect x="50" y="180" width="700" height="40" fill="#f9e2af" rx="6"/>
    <text x="70" y="205" fill="#11111b">3. Kernel Initialization (Khởi tạo RAM, CPU &amp; Mount initramfs tạm thời)</text>

    <rect x="50" y="235" width="700" height="40" fill="#a6e3a1" rx="6"/>
    <text x="70" y="260" fill="#11111b">4. initramfs Execution (Load drivers RAID/NVMe &amp; Mount Root / thực sự)</text>

    <rect x="50" y="290" width="700" height="40" fill="#89dceb" rx="6"/>
    <text x="70" y="315" fill="#11111b">5. Systemd PID 1 (Khởi tạo tiến trình gốc PID 1 &amp; chạy Default Target)</text>
  </g>
</svg>