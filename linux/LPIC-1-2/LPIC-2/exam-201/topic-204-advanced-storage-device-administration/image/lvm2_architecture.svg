<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <rect width="800" height="420" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" fill="#cba6f7" font-weight="bold" text-anchor="middle">KIẾN TRÚC LƯU TRỮ LVM2 (LOGICAL VOLUME MANAGER)</text>

  <!-- Physical Disks -->
  <rect x="60" y="70" width="200" height="60" fill="#89b4fa" rx="8"/>
  <text x="160" y="105" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">Physical Volumes (PV)<br/>/dev/sdb1, /dev/sdc1</text>

  <!-- Volume Group -->
  <rect x="60" y="180" width="680" height="80" fill="#cba6f7" rx="8"/>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="18" fill="#11111b" font-weight="bold" text-anchor="middle">Volume Group (VG): vg_data (Gộp dung lượng PVs)</text>

  <!-- Logical Volumes -->
  <rect x="60" y="300" width="310" height="70" fill="#a6e3a1" rx="8"/>
  <text x="215" y="340" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">Logical Volume (LV): /dev/vg_data/lv_app<br/>(Mount vào /var/log - Ext4)</text>

  <rect x="430" y="300" width="310" height="70" fill="#f9e2af" rx="8"/>
  <text x="585" y="340" font-family="Arial, sans-serif" font-size="14" fill="#11111b" font-weight="bold" text-anchor="middle">Logical Volume (LV): /dev/vg_data/lv_db<br/>(Mount vào /var/lib/mysql - XFS)</text>

  <!-- Connections -->
  <line x1="160" y1="130" x2="160" y2="180" stroke="#89b4fa" stroke-width="4"/>
  <line x1="215" y1="260" x2="215" y2="300" stroke="#a6e3a1" stroke-width="4"/>
  <line x1="585" y1="260" x2="585" y2="300" stroke="#f9e2af" stroke-width="4"/>
</svg>